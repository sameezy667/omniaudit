[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniaudit"
version = "0.1.0"
description = "Agentic AST test-generation, sandboxed triage, and auto-patch CLI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "OmniAudit contributors"}]
dependencies = []

[project.scripts]
omniaudit = "omniaudit.cli:main"

[tool.setuptools.packages.find]
include = ["omniaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
